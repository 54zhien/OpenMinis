name: Build iOS IPA
on:
  push:
    branches: [build/ios-macos26]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install prerequisites
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          echo "/bin" >> "$GITHUB_PATH"
          go version
          xcodebuild -version
          xcrun -sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Build native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Minis.app" Payload/
          zip -qry OpenMinis-unsigned.ipa Payload
          unzip -t OpenMinis-unsigned.ipa | tail -1
          shasum -a 256 OpenMinis-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-unsigned-ipa
          path: OpenMinis-unsigned.ipa
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore


