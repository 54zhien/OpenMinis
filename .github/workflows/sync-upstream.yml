name: Sync upstream
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == '54zhien/OpenMinis'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
